$correctedYaml = @'
name: Veille Emploi Quotidienne

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r job-agent/requirements.txt

      - name: Run job search agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
        run: python job-agent/src/job_agent.py
'@

Set-Content -Path "C:\Users\SECK TOURE\Documents\Code-multilanguage\.github\workflows\job_alert.yml" -Value $correctedYaml -Encoding UTF8