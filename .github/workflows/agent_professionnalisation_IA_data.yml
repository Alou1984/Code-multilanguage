name: Agent Recherche Emploi IA Data


on:

  schedule:

    # Tous les jours à 8h00 UTC
    - cron: "0 8 * * *"


  workflow_dispatch:



jobs:

  search_jobs:


    runs-on: ubuntu-latest



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r agent_professionnalisation_IA_data_PRO/requirements.txt



      - name: Check secrets availability

        env:

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

        run: |

          if [ -z "$EMAIL_SENDER" ]; then

            echo "EMAIL_SENDER absent"

            exit 1

          fi


          if [ -z "$EMAIL_PASSWORD" ]; then

            echo "EMAIL_PASSWORD absent"

            exit 1

          fi


          if [ -z "$EMAIL_RECEIVER" ]; then

            echo "EMAIL_RECEIVER absent"

            exit 1

          fi


          echo "Secrets email OK"



      - name: Run Agent IA Data

        working-directory: agent_professionnalisation_IA_data_PRO

        env:

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}


          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}

          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}


        run: |

          python -m agent_jobs.main