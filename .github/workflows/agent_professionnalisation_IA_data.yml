name: Agent Recherche Emploi IA Data


on:

  schedule:
    # 06h00 UTC = 08h00 France en été
    - cron: "0 6 * * *"

  workflow_dispatch:



jobs:


  recherche_emploi:


    runs-on: ubuntu-latest


    defaults:

      run:

        working-directory: agent_professionnalisation_IA_data_PRO



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Verify project

        run: |

          pwd

          ls -la

          find src -type f



      - name: Test SERPAPI secret

        env:

          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

        run: |

          if [ -z "$SERPAPI_API_KEY" ]; then

            echo "SERPAPI_API_KEY absent"

            exit 1

          else

            echo "SERPAPI_API_KEY OK"

          fi



      - name: Run Agent IA Data

        env:


          PYTHONPATH: src


          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}


          SMTP_HOST: ${{ secrets.SMTP_HOST }}


          SMTP_PORT: ${{ secrets.SMTP_PORT }}


          SMTP_USER: ${{ secrets.SMTP_USER }}


          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}


          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}


          EMAIL_TO: papalassane2003@yahoo.fr



        run:

          python -m agent_jobs.main