name: Agent Recherche Emploi IA Data


on:

  schedule:

    # Tous les jours à 8h00 UTC

    - cron: "0 8 * * *"


  workflow_dispatch:



jobs:


  search_jobs:


    runs-on: ubuntu-latest



    defaults:

      run:

        working-directory: agent_professionnalisation_IA_data_PRO



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Verify project structure

        run: |

          echo "Current directory:"

          pwd


          echo "Files:"

          ls -la


          echo "Source:"

          ls -la src


          echo "Agent package:"

          ls -la src/agent_jobs



      - name: Check secrets

        env:

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

        run: |


          if [ -z "$EMAIL_SENDER" ]; then

            echo "ERROR: EMAIL_SENDER absent"

            exit 1

          fi



          if [ -z "$EMAIL_PASSWORD" ]; then

            echo "ERROR: EMAIL_PASSWORD absent"

            exit 1

          fi



          if [ -z "$EMAIL_RECEIVER" ]; then

            echo "ERROR: EMAIL_RECEIVER absent"

            exit 1

          fi



          echo "Secrets email OK"



      - name: Run Agent IA Data

        env:


          PYTHONPATH: src


          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}



          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}

          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}



        run: |


          python -m agent_jobs.main