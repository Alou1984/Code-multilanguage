name: agent_professionnalisation_IA_data

on:
  schedule:
    # Exécution quotidienne 08h00 Europe/Paris
    # GitHub Actions utilise UTC
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  recherche-offres:

    runs-on: ubuntu-latest

    steps:

      # Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4


      # Installation Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # Installation dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Vérification des secrets
      - name: Verify GitHub secrets
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

        run: |

          echo "Vérification configuration..."

          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "ERREUR : SERPAPI_API_KEY absent"
            exit 1
          else
            echo "SERPAPI_API_KEY OK"
          fi


          if [ -z "$SMTP_USER" ]; then
            echo "ERREUR : SMTP_USER absent"
            exit 1
          else
            echo "SMTP_USER OK"
          fi


          if [ -z "$EMAIL_TO" ]; then
            echo "ERREUR : EMAIL_TO absent"
            exit 1
          else
            echo "EMAIL_TO OK"
          fi



      # Lancement agent Python
      - name: Run agent professionnalisation IA Data
        env:

          PYTHONPATH: src

          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}

          SMTP_PORT: ${{ secrets.SMTP_PORT }}

          SMTP_USER: ${{ secrets.SMTP_USER }}

          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

          EMAIL_TO: ${{ secrets.EMAIL_TO }}


          # Paramètres recherche
          SEARCH_LOCATION: "Sens 89100 France"

          SEARCH_RADIUS_KM: "80"

          CONTRACT_TYPE: "Contrat de professionnalisation"


        run: |

          echo "Lancement agent..."

          python -m agent_jobs.main



      # Conservation des logs
      - name: Save execution logs
        if: always()
        run: |

          echo "Workflow terminé"

          python --version