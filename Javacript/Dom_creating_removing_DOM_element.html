<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Creating Removing DOM element</title>
</head>
<body>
    <h1>My Favorite Foods</h1>
    <ul id="foodList">
        <li>Patatos</li>
        <li>Mangeos</li>
        <li>Litchies</li>
    </ul>
    <button id="addButton">Add Bananas</button>
    <button id="removeButton">Remove Litchies</button>
    <script>
        const addButton= document.querySelector('#addButton');
        const removeButton= document.querySelector('#removeButton');
        const foodList= document.querySelector('#foodList');
        addButton.addEventListener('click', () => {
            const newListItem = document.createElement('li');
            const newListItemText = document.createTextNode('Banamas');
            newListItem.append(newListItemText)
            foodList.appendChild(newListItem)
        })

        removeButton.addEventListener('click', () => {
            const Litchies= document.querySelector('li:nth-child(3)') 
            foodList.removeChild(Litchies)
        })


    </script>
</body>
</html>
