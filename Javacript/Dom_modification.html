<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>DOM_Modify_Style and Attributes </title>
</head>
<body>
    <h1>DOM class manipulation</h1>
    <div>
        <span id="one" name="first"> First span</span>
        <span id="two" name="second"> Second span</span>
    </div>

    <script>
        const div =document.querySelector("div")
        const spanOne= document.getElementById("one")
        const spanTwo= document.getElementById("two")

        console.log( spanOne.getAttribute('name'))
        spanOne.setAttribute("name", "mamamia")
        spanTwo.removeAttribute("name")
        spanOne.id="azertyui"

        spanTwo.classList.add('new-class')
        spanTwo.classList.remove('new-class')

        spanTwo.style.color='red'
        spanOne.style.backgroundColor="yellow"

    </script>
</body>
</html>
